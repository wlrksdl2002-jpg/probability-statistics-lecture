<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확률과 통계 퀴즈</title>
<link rel="stylesheet" href="./assets/theme.css">
<style>
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { color: var(--ink); font-size: 32px; margin: 8px 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .week-btn { font: inherit; text-align: left; border: 2px solid transparent; background: #fff; border-radius: 16px; padding: 14px 16px; cursor: pointer; box-shadow: 0 2px 10px rgba(38,33,92,.08); color: var(--text); }
  .week-btn:hover { border-color: var(--line); }
  .week-btn b { display: block; color: var(--ink); font-size: 17px; }
  .week-btn span { font-size: 14px; color: var(--muted); }
  .week-btn.all { background: var(--ink); color: #fff; }
  .week-btn.all b, .week-btn.all span { color: #fff; }
  .best { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--coral-text); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; color: var(--muted); font-size: 15px; }
  .bar { height: 8px; background: var(--tint); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .bar > i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s; }
  .q { font-size: 21px; font-weight: 700; color: var(--ink); margin: 0 0 18px; line-height: 1.55; }
  .tag { display: inline-block; font-size: 13px; font-weight: 700; background: var(--tint); color: var(--ink); border-radius: 999px; padding: 2px 10px; margin-bottom: 10px; }
  .opts { display: grid; gap: 10px; }
  .opt { font: inherit; font-size: 18px; text-align: left; display: flex; gap: 12px; align-items: center; width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--tint); background: #fff; cursor: pointer; color: var(--text); }
  .opt:hover:not(:disabled) { border-color: var(--line); }
  .opt .k { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--tint); color: var(--ink); font-weight: 900; display: grid; place-items: center; font-size: 15px; }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: #1E8E5A; background: #E6F6EE; }
  .opt.correct .k { background: #1E8E5A; color: #fff; }
  .opt.wrong { border-color: var(--coral-text); background: #FDECE8; }
  .opt.wrong .k { background: var(--coral-text); color: #fff; }
  .feedback { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--tint); min-height: 1px; }
  .feedback:empty { display: none; }
  .feedback b.ok { color: #1E8E5A; }
  .feedback b.no { color: var(--coral-text); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .score { font-size: 56px; font-weight: 900; color: var(--ink); margin: 4px 0; }
  .review { display: grid; gap: 12px; margin-top: 16px; }
  .review .card p { margin: 6px 0; }
  .hint { font-size: 14px; color: var(--muted); margin-top: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<nav class="site-nav"><a class="brand" href="index.html">확률과 통계</a><a class="nav-link" href="index.html">강의 목록</a><a class="nav-link" href="quiz.html" aria-current="page">퀴즈</a><a class="nav-link" href="playground.html">애니메이션 놀이터</a></nav>
<main>
  <section id="home">
    <h1>확인 퀴즈</h1>
    <p class="lead">주차를 고르면 4문제, 전체 랜덤은 10문제. 답을 고르면 바로 채점과 해설.</p>
    <div class="weeks" id="weeks"></div>
  </section>

  <section id="play" class="card" hidden>
    <div class="top"><span id="progress"></span><span id="live-score"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <span class="tag" id="qtag"></span>
    <p class="q" id="qtext"></p>
    <div class="opts" id="opts" role="group" aria-labelledby="qtext"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="actions">
      <button class="btn" id="next" hidden>다음 문제</button>
      <button class="btn secondary" id="quit">처음으로</button>
    </div>
    <p class="hint">키보드: 1~4로 선택, Enter로 다음 문제</p>
  </section>

  <section id="result" class="card" hidden>
    <p class="tag" id="rtag"></p>
    <p class="score" id="rscore"></p>
    <p id="rmsg"></p>
    <div class="actions">
      <button class="btn" id="retry">다시 풀기</button>
      <button class="btn secondary" id="home-btn">다른 주차 고르기</button>
    </div>
    <div class="review" id="review"></div>
  </section>
</main>

<script>
// 문제 은행: opts[0]이 정답 (화면에서는 섞어서 보여 줌). 모든 수치는 python으로 검산함.
const WEEKS = ["원순열과 중복순열","같은 것이 있는 순열과 중복조합","이항정리와 파스칼의 삼각형","확률의 뜻과 덧셈정리","조건부확률과 독립","확률변수와 기댓값","이항분포","연속확률변수와 정규분포","모집단과 표본","모평균의 추정"];
const BANK = [
  // 1주차
  {w:1, q:"서로 다른 센서 6개를 회전 대칭인 원형 장치 둘레에 같은 간격으로 배치하는 방법의 수", opts:["120","720","60","36"], exp:"회전하여 같은 배치는 하나로 취급하는 원순열: (6−1)! = 5! = 120. 720 = 6!은 일렬 배열의 수"},
  {w:1, q:"서로 다른 작업 4개를 서버 3대에 할당하는 방법의 수 (작업이 없는 서버 허용)", opts:["81","64","12","24"], exp:"작업마다 서버 3대 중 하나 선택: <sub>3</sub>Π<sub>4</sub> = 3<sup>4</sup> = 81. 4<sup>3</sup> = 64는 밑과 지수를 뒤바꾼 실수"},
  {w:1, q:"0~9 숫자로 된 4자리 번호 자물쇠에서 만들 수 있는 번호의 개수 (같은 숫자 반복 허용)", opts:["10000","5040","40","210"], exp:"자리마다 10가지인 중복순열: 10<sup>4</sup> = 10000. 5040 = <sub>10</sub>P<sub>4</sub>는 반복을 금지한 경우"},
  {w:1, q:"부모를 포함한 5명의 가족이 원탁에 앉을 때, 부모가 이웃하여 앉는 방법의 수", opts:["12","6","24","48"], exp:"부모를 한 묶음으로 보면 4개의 원순열 (4−1)! = 6, 묶음 안 자리바꿈 2! = 2 → 6 × 2 = 12"},
  // 2주차
  {w:2, q:"ENGINEER의 8개 문자를 모두 일렬로 배열하는 방법의 수", opts:["3360","40320","6720","1260"], exp:"E 3개, N 2개가 같은 것이 있는 순열: 8!/(3! × 2!) = 3360. 40320 = 8!은 모든 문자를 다르게 본 실수"},
  {w:2, q:"격자 도로망에서 오른쪽 5칸, 위쪽 3칸 떨어진 지점까지 최단 거리로 가는 방법의 수", opts:["56","15","120","40320"], exp:"→ 5개, ↑ 3개를 일렬로 배열: 8!/(5! × 3!) = 56"},
  {w:2, q:"x + y + z = 6을 만족시키는 음이 아닌 정수해 (x, y, z)의 개수", opts:["28","10","84","21"], exp:"x, y, z 중 중복을 허용하여 6개를 택하는 중복조합: <sub>3</sub>H<sub>6</sub> = <sub>8</sub>C<sub>6</sub> = 28. 10은 양의 정수해의 개수"},
  {w:2, q:"온도·압력·습도 센서 3종류 중에서 중복을 허용하여 5개를 구입하는 방법의 수 (같은 종류끼리는 구별 없음)", opts:["21","243","10","35"], exp:"순서 없는 중복 선택이므로 중복조합: <sub>3</sub>H<sub>5</sub> = <sub>7</sub>C<sub>5</sub> = 21. 243 = 3<sup>5</sup>은 순서를 따진 중복순열"},
  // 3주차
  {w:3, q:"(x + 1)<sup>8</sup>의 전개식에서 x<sup>3</sup>의 계수", opts:["56","28","70","8"], exp:"일반항 <sub>8</sub>C<sub>r</sub> x<sup>r</sup>에서 r = 3: <sub>8</sub>C<sub>3</sub> = 56"},
  {w:3, q:"(2x − 1)<sup>5</sup>의 전개식에서 x<sup>2</sup>의 계수", opts:["−40","40","−80","10"], exp:"<sub>5</sub>C<sub>2</sub> (2x)<sup>2</sup> (−1)<sup>3</sup> = 10 × 4 × (−1) = −40. 부호를 빠뜨리면 40"},
  {w:3, q:"<sub>8</sub>C<sub>0</sub> + <sub>8</sub>C<sub>1</sub> + … + <sub>8</sub>C<sub>8</sub>의 값 (8비트 비트열 전체의 개수)", opts:["256","128","8","40320"], exp:"(1 + 1)<sup>8</sup>에 x = 1 대입: 2<sup>8</sup> = 256"},
  {w:3, q:"파스칼의 삼각형에서 <sub>6</sub>C<sub>2</sub> = 15, <sub>6</sub>C<sub>3</sub> = 20일 때 <sub>7</sub>C<sub>3</sub>의 값", opts:["35","300","21","5"], exp:"<sub>7</sub>C<sub>3</sub> = <sub>6</sub>C<sub>2</sub> + <sub>6</sub>C<sub>3</sub> = 15 + 20 = 35 (위 두 수의 합)"},
  // 4주차
  {w:4, q:"주사위 2개를 던질 때 눈의 합이 7일 확률", opts:["1/6","1/12","7/36","1/11"], exp:"(1,6), (2,5), …, (6,1)의 6가지 / 36가지 = 1/6. 1/11은 합 2~12를 같은 가능성으로 본 실수"},
  {w:4, q:"P(A) = 0.3, P(B) = 0.4, P(A ∩ B) = 0.1일 때 P(A ∪ B)", opts:["0.6","0.7","0.12","0.5"], exp:"덧셈정리: 0.3 + 0.4 − 0.1 = 0.6. 0.7은 겹치는 부분을 빼지 않은 실수"},
  {w:4, q:"불량품 2개가 섞인 부품 8개에서 2개를 꺼낼 때, 적어도 1개가 불량품일 확률", opts:["13/28","1/28","15/28","1/4"], exp:"여사건 이용: 1 − (둘 다 정상) = 1 − <sub>6</sub>C<sub>2</sub>/<sub>8</sub>C<sub>2</sub> = 1 − 15/28 = 13/28"},
  {w:4, q:"외관 결함 A와 전기적 결함 B가 배반사건이고 P(A) = 0.25, P(B) = 0.35일 때 P(A ∪ B)", opts:["0.6","0.0875","0.5125","0.1"], exp:"배반사건이면 P(A ∩ B) = 0이므로 0.25 + 0.35 = 0.6"},
  // 5주차
  {w:5, q:"P(A) = 0.4, P(A ∩ B) = 0.1일 때 P(B | A)", opts:["0.25","0.04","0.4","0.1"], exp:"P(B | A) = P(A ∩ B)/P(A) = 0.1/0.4 = 0.25"},
  {w:5, q:"작동 확률 0.9인 부품 2개를 직렬로 연결한 시스템의 작동 확률 (부품은 독립)", opts:["0.81","0.99","0.9","0.18"], exp:"직렬은 둘 다 작동해야 함: 0.9 × 0.9 = 0.81"},
  {w:5, q:"작동 확률 0.9인 부품 2개를 병렬로 연결한 시스템의 작동 확률 (부품은 독립)", opts:["0.99","0.81","0.9","0.19"], exp:"병렬은 둘 다 고장일 때만 정지: 1 − 0.1 × 0.1 = 0.99"},
  {w:5, q:"비트 오류 확률 0.1인 채널로 3비트를 보낼 때 정확히 1비트만 오류일 확률 (각 비트 독립)", opts:["0.243","0.081","0.1","0.729"], exp:"독립시행: <sub>3</sub>C<sub>1</sub> × 0.1 × 0.9<sup>2</sup> = 0.243. 0.081은 <sub>3</sub>C<sub>1</sub>을 빠뜨린 실수"},
  // 6주차
  {w:6, q:"하루 고장 건수 X의 분포가 P(X=0) = 0.5, P(X=1) = 0.3, P(X=2) = 0.2일 때 E(X)", opts:["0.7","1","0.5","1.1"], exp:"E(X) = 0 × 0.5 + 1 × 0.3 + 2 × 0.2 = 0.7"},
  {w:6, q:"앞 문제의 X (E(X) = 0.7)의 분산 V(X)", opts:["0.61","1.1","0.49","0.42"], exp:"E(X<sup>2</sup>) = 0.3 + 4 × 0.2 = 1.1, V(X) = 1.1 − 0.7<sup>2</sup> = 0.61. 1.1은 평균의 제곱을 빼지 않은 값"},
  {w:6, q:"E(X) = 3, V(X) = 4일 때 V(2X + 5)", opts:["16","13","8","21"], exp:"V(aX + b) = a<sup>2</sup>V(X) = 4 × 4 = 16. 더하는 5는 흩어진 정도와 무관"},
  {w:6, q:"σ(X) = 2일 때 σ(3X − 1)", opts:["6","5","18","36"], exp:"σ(aX + b) = |a|σ(X) = 3 × 2 = 6"},
  // 7주차
  {w:7, q:"불량률 0.2인 공정에서 부품 10개를 뽑을 때 불량품 개수 X ~ B(10, 0.2)의 평균과 분산", opts:["평균 2, 분산 1.6","평균 2, 분산 0.4","평균 0.2, 분산 1.6","평균 8, 분산 1.6"], exp:"E(X) = np = 2, V(X) = npq = 10 × 0.2 × 0.8 = 1.6"},
  {w:7, q:"X ~ B(4, 1/2)일 때 P(X = 2)", opts:["0.375","0.5","0.25","0.0625"], exp:"<sub>4</sub>C<sub>2</sub> (1/2)<sup>4</sup> = 6/16 = 0.375"},
  {w:7, q:"X ~ B(5, 0.1)일 때 불량품이 하나도 없을 확률 P(X = 0) (소수 셋째 자리까지)", opts:["0.590","0.500","0.100","0.410"], exp:"0.9<sup>5</sup> = 0.59049 ≈ 0.590. 0.410은 '하나 이상'의 확률"},
  {w:7, q:"평균 12, 분산 3인 이항분포 B(n, p)의 n과 p", opts:["n = 16, p = 0.75","n = 48, p = 0.25","n = 16, p = 0.25","n = 12, p = 0.75"], exp:"npq/np = q = 3/12 = 0.25 → p = 0.75, n = 12/0.75 = 16"},
  // 8주차
  {w:8, q:"연속확률변수 X에 대하여 P(X = 2)의 값", opts:["0","f(2)","1/2","정할 수 없음"], exp:"확률은 넓이이므로 한 점의 넓이 = 0. f(2)는 확률이 아닌 밀도"},
  {w:8, q:"대기 시간 X(분)의 확률밀도함수가 f(x) = 1/20 (0 ≤ x ≤ 20)일 때 P(5 ≤ X ≤ 9)", opts:["0.2","0.25","0.45","4"], exp:"직사각형 넓이: (9 − 5) × 1/20 = 0.2"},
  {w:8, q:"저항값 X ~ N(100, 5<sup>2</sup>)에서 X = 110을 표준화한 값 Z", opts:["2","10","0.5","22"], exp:"Z = (110 − 100)/5 = 2"},
  {w:8, q:"Z ~ N(0, 1)에서 P(0 ≤ Z ≤ 2) = 0.4772일 때 P(Z ≥ 2)", opts:["0.0228","0.4772","0.9772","0.0456"], exp:"0.5 − 0.4772 = 0.0228. 0.0456은 양쪽 꼬리 |Z| ≥ 2의 확률"},
  // 9주차
  {w:9, q:"모평균 30, 모표준편차 8인 모집단에서 크기 16인 표본을 뽑을 때 σ(X̄)", opts:["2","0.5","8","4"], exp:"σ(X̄) = σ/√n = 8/√16 = 2"},
  {w:9, q:"표본의 크기를 9배로 늘리면 표본평균의 표준편차 σ(X̄)는 몇 배?", opts:["1/3배","1/9배","3배","변화 없음"], exp:"σ/√n에서 √9 = 3 → 1/3배"},
  {w:9, q:"X ~ B(400, 0.5)를 근사하는 정규분포", opts:["N(200, 10<sup>2</sup>)","N(200, 100<sup>2</sup>)","N(200, 20<sup>2</sup>)","N(100, 10<sup>2</sup>)"], exp:"평균 np = 200, 분산 npq = 100 → 표준편차 10"},
  {w:9, q:"부품 무게 모평균 50g, 모표준편차 4g. 16개 표본의 평균이 51g 이상일 확률 (P(0 ≤ Z ≤ 1) = 0.3413)", opts:["0.1587","0.3413","0.4013","0.0228"], exp:"σ(X̄) = 4/√16 = 1, Z = (51 − 50)/1 = 1 → 0.5 − 0.3413 = 0.1587"},
  // 10주차
  {w:10, q:"σ = 15, n = 36, x̄ = 120일 때 모평균 m의 신뢰도 95% 신뢰구간", opts:["115.1 ≤ m ≤ 124.9","113.55 ≤ m ≤ 126.45","119.18 ≤ m ≤ 120.82","90.6 ≤ m ≤ 149.4"], exp:"1.96 × 15/√36 = 4.9 → 120 ± 4.9. 113.55~126.45는 신뢰도 99%(2.58)의 구간"},
  {w:10, q:"다른 조건은 같고 신뢰도를 95%에서 99%로 높이면 신뢰구간의 길이는?", opts:["길어짐","짧아짐","변화 없음","절반"], exp:"1.96 → 2.58로 곱하는 수가 커지므로 길어짐. 더 확신하려면 더 넓은 그물"},
  {w:10, q:"신뢰구간의 길이를 절반으로 줄이려면 표본의 크기는 몇 배?", opts:["4배","2배","1/4배","8배"], exp:"길이는 1/√n에 비례 → √n이 2배, n은 4배"},
  {w:10, q:"신뢰도 95% 신뢰구간의 올바른 해석", opts:["같은 방법으로 신뢰구간을 여러 번 만들면 그중 약 95%가 모평균을 포함","표본 자료의 95%가 이 구간 안에 있음","표본평균이 95% 확률로 이 구간 안에 있음","모평균이 표본마다 바뀌며 95%가 이 구간 안"], exp:"모평균은 고정된 값, 바뀌는 것은 구간. 100개 시뮬레이션에서 약 95개가 모평균을 포함"}
];

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

let mode = null, set = [], idx = 0, score = 0, answered = false, wrongs = [], current = null;

function renderHome() {
  const best = store.get("pstat-quiz-best") || {};
  const btn = (key, title, sub, cls = "") => {
    const b = best[key] != null ? `<span class="best">최고 ${best[key]}</span>` : "";
    return `<button class="week-btn ${cls}" data-mode="${key}"><b>${title}</b><span>${sub}</span>${b}</button>`;
  };
  $("weeks").innerHTML = btn("all", "전체 랜덤", "10문제", "all") + WEEKS.map((t, i) => btn(String(i + 1), `${i + 1}주차`, t)).join("");
  $("weeks").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => start(b.dataset.mode)));
}

function show(sec) { ["home", "play", "result"].forEach((s) => ($(s).hidden = s !== sec)); }

function start(m) {
  mode = m;
  set = m === "all" ? shuffle(BANK).slice(0, 10) : BANK.filter((q) => String(q.w) === m);
  idx = 0; score = 0; wrongs = [];
  show("play");
  renderQ();
}

function renderQ() {
  answered = false;
  const item = set[idx];
  current = { item, order: shuffle(item.opts.map((o, i) => i)) };
  $("progress").textContent = `${idx + 1} / ${set.length}`;
  $("live-score").textContent = `맞힌 문제 ${score}`;
  $("bar").style.width = `${(idx / set.length) * 100}%`;
  $("qtag").textContent = `${item.w}주차 · ${WEEKS[item.w - 1]}`;
  $("qtext").innerHTML = item.q;
  $("opts").innerHTML = current.order.map((oi, k) =>
    `<button class="opt" data-k="${k}"><span class="k" aria-hidden="true">${k + 1}</span><span>${item.opts[oi]}</span></button>`).join("");
  $("opts").querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => choose(+b.dataset.k)));
  $("feedback").innerHTML = "";
  $("next").hidden = true;
  $("opts").querySelector(".opt").focus();
}

function choose(k) {
  if (answered) return;
  answered = true;
  const { item, order } = current;
  const ok = order[k] === 0;
  const btns = $("opts").querySelectorAll(".opt");
  btns.forEach((b, i) => { b.disabled = true; if (order[i] === 0) b.classList.add("correct"); });
  if (ok) score++;
  else { btns[k].classList.add("wrong"); wrongs.push({ item, picked: item.opts[order[k]] }); }
  $("feedback").innerHTML = `<b class="${ok ? "ok" : "no"}">${ok ? "정답" : "오답"}</b> · 정답: ${item.opts[0]}<br>${item.exp}`;
  $("live-score").textContent = `맞힌 문제 ${score}`;
  $("next").hidden = false;
  $("next").textContent = idx === set.length - 1 ? "결과 보기" : "다음 문제";
  $("next").focus();
}

function next() {
  if (!answered) return;
  if (idx < set.length - 1) { idx++; renderQ(); } else finish();
}

function finish() {
  $("bar").style.width = "100%";
  const best = store.get("pstat-quiz-best") || {};
  const label = `${score} / ${set.length}`;
  const prev = best[mode] ? +best[mode].split(" / ")[0] : -1;
  if (score > prev) { best[mode] = label; store.set("pstat-quiz-best", best); }
  $("rtag").textContent = mode === "all" ? "전체 랜덤" : `${mode}주차 · ${WEEKS[+mode - 1]}`;
  $("rscore").textContent = label;
  $("rmsg").textContent = score === set.length ? "모두 정답. 다음 주차로 이동 추천" : `틀린 문제 ${wrongs.length}개. 아래 해설 확인 후 다시 풀기 추천`;
  $("review").innerHTML = wrongs.map((w) =>
    `<div class="card"><span class="tag">${w.item.w}주차</span><p><b>${w.item.q}</b></p><p>내 답: ${w.picked} · <b style="color:#1E8E5A">정답: ${w.item.opts[0]}</b></p><p style="color:var(--muted)">${w.item.exp}</p></div>`).join("");
  show("result");
  $("retry").focus();
}

$("next").addEventListener("click", next);
$("quit").addEventListener("click", () => { renderHome(); show("home"); });
$("retry").addEventListener("click", () => start(mode));
$("home-btn").addEventListener("click", () => { renderHome(); show("home"); });
document.addEventListener("keydown", (e) => {
  if ($("play").hidden) return;
  if (/^[1-4]$/.test(e.key) && !answered) { choose(+e.key - 1); e.preventDefault(); }
  else if (e.key === "Enter" && answered && document.activeElement !== $("next")) { next(); e.preventDefault(); }
});
renderHome();
</script>
</body>
</html>
